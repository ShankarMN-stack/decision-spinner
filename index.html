<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Spinner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🎯 Decision Spinner</h1>
        <p>Can't decide? Add your options and let chance choose.</p>

        <input
            type="text"
            id="optionInput"
            placeholder="Enter an option..."
        >
        <button id="addButton">Add Option</button>

        <ul id="optionList"></ul>

        <button id="decideButton">Make a Decision</button>

        <h2 id="result"></h2>
    </main>

    <script src="script.js"></script>
</body>
</html>
